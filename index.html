<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STREET / TYPO — Never Finished Archief</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap');

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      background: #f0eee6; 
      color: #000; 
      font-family: 'Space Mono', monospace, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* GRID ESTHETIEK UIT JOUW WIREFRAME */
    .grid-border {
      border: 2px solid #000;
    }
    .grid-cell {
      border-right: 1px solid #000;
      border-bottom: 1px solid #000;
    }

    /* HERO SECTION MET MATRIX GRID */
    .hero-container {
      width: 100vw;
      height: 100svh;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: #f0eee6;
      padding: 16px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: 70px repeat(5, 1fr);
      width: 100%;
      height: 100%;
      border: 2px solid #000;
      position: relative;
      background: #f0eee6;
    }

    /* VALLENDE TYPO KAARTEN IN DE HERO */
    .fall-letter {
      position: absolute;
      width: clamp(100px, 14vw, 160px);
      aspect-ratio: 1 / 1;
      left: var(--x);
      top: -150px;
      opacity: 0;
      border: 2px solid #000;
      padding: 8px;
      cursor: pointer;
      animation: fallLetters var(--speed) cubic-bezier(.38,.02,.67,.8) var(--delay) infinite;
      transform-origin: center;
      background: #f0eee6;
      box-shadow: 4px 4px 0px #000;
      z-index: 5;
    }

    .fall-letter::after {
      content: attr(data-label);
      position: absolute;
      bottom: -22px;
      left: 0;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.05em;
      background: #000;
      color: #fff;
      padding: 2px 6px;
      white-space: nowrap;
    }

    @keyframes fallLetters {
      0% { opacity: 0; transform: translateY(0) rotate(var(--r)) scale(.8); }
      10% { opacity: 1; }
      60% { opacity: 1; transform: translateY(65svh) rotate(calc(var(--r) * -.5)) scale(1); }
      85% { opacity: 1; transform: translateY(105svh) rotate(12deg) scale(.6); }
      98%, 100% { opacity: 0; transform: translateY(115svh) rotate(20deg) scale(0); }
    }

    .fall-letter:hover {
      animation-play-state: paused;
      transform: scale(1.12) rotate(0deg) !important;
      z-index: 20;
      background: #fff;
    }

    /* GOTISCH FONT AKCENT VOOR DE T IN TYPO */
    .font-gothic {
      font-family: 'UnifrakturMaguntia', serif;
    }

    /* CATALOGUS SECTIE (DRIE EDITIES) */
    .catalogue-section {
      border-top: 2px solid #000;
      background: #e6e3d5;
      padding: 60px 24px;
    }

    .edition-row {
      display: grid;
      grid-template-columns: 100px 1fr 340px;
      gap: 32px;
      align-items: center;
      padding: 40px 0;
      border-bottom: 2px solid #000;
    }

    .edition-row:first-child {
      border-top: 2px solid #000;
    }

    @media (max-width: 850px) {
      .hero-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .edition-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    // DE 3 HOOFDEDITIES (TYPO, BEELD, HANDELING)
    const editions = [
      {
        num: "ED.01",
        title: "TYPO",
        subtitle: "Het Modulaire Tegelraster",
        desc: "Onderzoek naar kinetische, modulaire straat-typografie. Opgebouwd uit een vaste bibliotheek van 20 geometrische tegelvormen (bogen, neon-ringen, arceeringen, spiegeling) gebaseerd op Belgische gevels.",
        color: "#A63D2B",
        bg: "#F4F1EA",
        char: "V"
      },
      {
        num: "ED.02",
        title: "BEELD",
        subtitle: "Fotografisch Archief & Vacuüm",
        desc: "Visuele documentatie van verdwijnende Belgische winkelpuien, beenhouwerijen, oude cafés en vergeten tilework. Onderdeel van het wekelijkse 'Never Finished' vacuüm-archief.",
        color: "#1B5238",
        bg: "#E8E3D8",
        char: "A"
      },
      {
        num: "ED.03",
        title: "HANDELING",
        subtitle: "Tactiel & Physical Interaction",
        desc: "De fysieke actie van het verpakken, vacumeren en bouwen van ruimtelijke typografische installaties. Typografie als tastbaar object en materiaalexperiment.",
        color: "#D9A036",
        bg: "#E6E8E3",
        char: "8"
      }
    ];

    // MODULAIRE TEGEL GENERATOR (20-FORMEN SYSTEEM)
    function generateModularGrid(primaryColor) {
      let html = '<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; width: 100%; height: 100%;">';
      const shapes = [
        'border-radius: 100% 0 0 0;', // 1/4 arc
        'border-radius: 0 100% 0 0;',
        'border-radius: 50%;', // ring/circle
        'border-radius: 0;', // solid rect
        'clip-path: polygon(0 0, 100% 0, 0 100%);', // diagonal
        'border-radius: 20px;' // pill
      ];
      
      const colors = [primaryColor, '#111111', '#D9A036', '#E6E3D5'];

      for(let i = 0; i < 16; i++) {
        let shape = shapes[i % shapes.length];
        let bg = colors[(i * 3) % colors.length];
        html += `<div style="background: ${bg}; ${shape} aspect-ratio: 1; width: 100%;"></div>`;
      }
      html += '</div>';
      return html;
    }

    // BOUW DE COMPLEET NIEUWE INTERFACE
    function renderApp() {
      let html = `
        <!-- HERO CONTAINER MET JOUW GRID-WIREFRAME -->
        <div class="hero-container">
          <div class="hero-grid">
            
            <!-- HEADER BARS (ZOALS IN JOUW SCHETS) -->
            <div class="grid-cell p-3 flex flex-col justify-between font-bold text-xs bg-[#f0eee6]">
              <div>STREET<br>/ TYPO</div>
              <div class="text-[9px] opacity-60 font-normal">VELD ONDERZOEK 2026-27</div>
            </div>

            <div class="grid-cell p-3 font-bold text-xs flex items-center justify-center text-center bg-[#f0eee6]">
              ARCHIEF VAN GEVONDEN TYPO
            </div>

            <div class="grid-cell p-3 font-bold text-xs flex items-center justify-center bg-[#f0eee6]">
              INDEX
            </div>

            <div class="grid-cell p-3 font-bold text-xs flex items-center justify-center bg-[#f0eee6] col-span-3 sm:col-span-3">
              TAXONOMY
            </div>

            <!-- LEGE GRID VAKKEN WAARIN DE TYPO VLIEGT -->
            ${Array.from({ length: 24 }).map((_, i) => `<div class="grid-cell"></div>`).join('')}

            <!-- CENTRALE DYNAMISCHE TITEL (UIT JOUW PROTOTYPE) -->
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-10">
              <div class="flex items-center space-x-2 text-5xl md:text-8xl font-extrabold tracking-tight">
                <span>STREET</span>
                <span class="font-gothic text-6xl md:text-9xl font-normal px-1">T</span>
                <span>YPO</span>
              </div>
              <div class="text-4xl md:text-7xl font-extrabold tracking-wider mt-1">
                NEVER FINISHED
              </div>
            </div>

            <!-- RECHTSONDER: TYPO VAN DE WEEK (UIT JOUW WIREFRAME) -->
            <div class="absolute bottom-0 right-0 w-36 h-36 bg-[#f0eee6] border-t-2 border-l-2 border-black p-2 flex flex-col justify-between z-20">
              <div class="text-[9px] font-bold uppercase tracking-widest opacity-70">
                TYPO VAN DE WEEK:
              </div>
              <div class="text-5xl font-extrabold text-right font-mono">
                A
              </div>
            </div>

            <!-- VALLENDE KINETISCHE TYPO-KAARTEN -->
            ${editions.map((ed, idx) => {
              const pos = [
                { x: "18%", r: "-10deg", speed: "10s", delay: "0s" },
                { x: "42%", r: "6deg", speed: "12s", delay: "2.5s" },
                { x: "68%", r: "-8deg", speed: "11s", delay: "1s" }
              ][idx];

              return `
                <div 
                  className="fall-letter" 
                  data-label="${ed.num} — ${ed.title}"
                  style="--x: ${pos.x}; --r: ${pos.r}; --speed: ${pos.speed}; --delay: ${pos.delay}; background: ${ed.bg};"
                >
                  ${generateModularGrid(ed.color)}
                </div>
              `;
            }).join('')}

          </div>
        </div>

        <!-- CATALOGUS SECTIE (DRIE EDITIES: TYPO, BEELD, HANDELING) -->
        <section class="catalogue-section" id="catalogue">
          <div class="flex justify-between items-center text-xs font-bold uppercase tracking-widest mb-12 pb-4 border-b-2 border-black">
            <span>NEVER FINISHED / DRIELUIK</span>
            <span>ED.01 — ED.03</span>
          </div>

          <div class="space-y-4">
            ${editions.map((ed) => `
              <div class="edition-row">
                <div class="text-3xl font-extrabold font-mono">${ed.num}</div>
                <div>
                  <div class="text-xs font-bold tracking-widest uppercase opacity-60 mb-1">${ed.subtitle}</div>
                  <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-3">${ed.title}</h2>
                  <p class="text-xs leading-relaxed max-w-xl opacity-80">${ed.desc}</p>
                </div>
                <div class="w-full aspect-square border-2 border-black p-3" style="background: ${ed.bg}">
                  ${generateModularGrid(ed.color)}
                </div>
              </div>
            `).join('')}
          </div>

          <footer class="mt-20 pt-6 border-t-2 border-black flex justify-between text-xs font-bold uppercase tracking-widest">
            <span>LUCA SINT-LUCAS GENT</span>
            <span>2026–2027</span>
          </footer>
        </section>
      `;

      document.getElementById('app').innerHTML = html;
    }

    renderApp();
  </script>
</body>
</html>
